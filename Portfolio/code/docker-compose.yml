
services:
  # Sites HTML, CSS, JavaScript et PHP
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: code_web
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    restart: unless-stopped

  # Application Vue.js avec Vite
  vue:
    image: node:22-alpine
    container_name: code_vue
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./TP_vue.js:/app
      - vue_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    profiles: ["vue"]
    restart: unless-stopped

  # Environnement Python
  python:
    image: python:3.12-slim
    container_name: code_python
    working_dir: /app
    volumes:
      - ./tp-python:/app
    command: tail -f /dev/null
    profiles: ["python"]
    restart: unless-stopped

  # Base de données facultative
  mysql:
    image: mysql:8.0
    container_name: code_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_dev_123
      MYSQL_DATABASE: projets
      MYSQL_USER: dev
      MYSQL_PASSWORD: dev_123
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    profiles: ["database"]
    restart: unless-stopped

volumes:
  vue_modules:
  mysql_data:
